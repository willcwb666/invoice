name: Push Notification Dispatcher

on:
  schedule:
    # Executa a cada 10 minutos para disparar lembretes de saída e trânsito (100% grátis, sem limites da Vercel Hobby)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dispatcher
        run: |
          TARGET_URL="${{ vars.APP_URL || secrets.APP_URL || vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "Aviso: APP_URL não definida em GitHub Variables/Secrets. O sistema usará o heartbeat in-app e Vercel cron."
            exit 0
          fi
          echo "Disparando Push Dispatcher em $TARGET_URL..."
          curl -s -f -X POST "$TARGET_URL/api/v1/cron/push-dispatcher" \
            -H "x-cron-key: rm_cron_secret_e8a209b17c91f0449a5b3" \
            -H "Authorization: Bearer rm_cron_secret_e8a209b17c91f0449a5b3" || true
